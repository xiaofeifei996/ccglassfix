name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build probe dylib (arm64e)
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -arch arm64e -miphoneos-version-min=15.0 \
            -isysroot "$SDK" -dynamiclib -fobjc-arc -O2 -fvisibility=hidden \
            -framework Foundation -framework UIKit -o CCFixProbe.dylib probe/CCFixProbe.m
          xcrun --sdk iphoneos clang -arch arm64e -miphoneos-version-min=15.0 \
            -isysroot "$SDK" -dynamiclib -fobjc-arc -O2 -fvisibility=hidden \
            -framework Foundation -framework UIKit -o CCGlassFix.dylib tweak/CCGlassFix.m
          xcrun --sdk iphoneos clang -arch arm64e -miphoneos-version-min=15.0 \
            -isysroot "$SDK" -dynamiclib -fobjc-arc -O2 -fvisibility=hidden \
            -framework Foundation -framework UIKit -framework QuartzCore -framework CoreGraphics \
            -o CCLayerProbe.dylib probe/CCLayerProbe.m
          file CCFixProbe.dylib CCGlassFix.dylib CCLayerProbe.dylib
          ls -la *.dylib
      - name: Publish dylib as release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: probe
          name: probe
          files: |
            CCFixProbe.dylib
            CCGlassFix.dylib
            CCLayerProbe.dylib
          fail_on_unmatched_files: true
